spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: department-service
              uri:
                lb://department-service
              predicates:
                - Path=/api/department/**
              filters:
                - StripPrefix=2

            - id: employee-service
              uri:
                lb://employee-service
              predicates:
                - Path=/api/employee/**
              filters:
                - StripPrefix=2
server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
