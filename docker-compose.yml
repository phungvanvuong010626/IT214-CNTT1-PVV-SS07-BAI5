services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: ss07-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  redis:
    image: redis:latest
    container_name: ss07-redis-1
    ports:
      - "6379:6379"
    command: redis-server --requirepass "123456789"

  # ==================================================
  # DEPARTMENT DATABASE
  # ==================================================
  department-db:
    image: mysql:8.4
    container_name: department-db
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: department_db
    volumes:
      - department_db_data:/var/lib/mysql
    restart: always

  # ==================================================
  # EMPLOYEE DATABASE
  # ==================================================
  employee-db:
    image: mysql:8.4
    container_name: employee-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: '1234$'
      MYSQL_DATABASE: employee_db
    volumes:
      - employee_db_data:/var/lib/mysql
    restart: always

volumes:
  department_db_data:
  employee_db_data:
